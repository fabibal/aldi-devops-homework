apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ .Release.Name }}   # was: myapp

spec:
  ingressClassName: nginx   # new
  rules:
    - host: myapp.local
      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: {{ .Release.Name }}   # was: homeworks (typo)
                port:
                  number: {{ .Values.service.port }}   # was: 80
